<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071433">
    <title>CRChatbot Version 1.0.4</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #050d24;
            --blue: #2563eb;
            --sky: #38bdf8;
            --sky-soft: #7dd3fc;
            --text: #eaf3ff;
            --muted: #8fa8cf;
            --line: rgba(125, 180, 255, 0.16);
            --panel: rgba(13, 30, 76, 0.62);
            --grad: linear-gradient(135deg, #1e40ff 0%, #2f7cff 45%, #38bdf8 100%);
            --font: "Manrope", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
            --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
        }

        * { box-sizing: border-box; }
        [hidden] { display: none !important; }

        html, body { height: 100%; }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            font-family: var(--font);
            color: var(--text);
            background:
                radial-gradient(900px 520px at 12% -12%, rgba(37, 99, 235, 0.5), transparent 60%),
                radial-gradient(760px 480px at 100% 0%, rgba(56, 189, 248, 0.26), transparent 55%),
                linear-gradient(180deg, #071433 0%, var(--bg) 100%);
            background-attachment: fixed;
        }

        :focus-visible {
            outline: 2px solid var(--sky);
            outline-offset: 2px;
        }

        /* ---------- Icon tile ---------- */
        .avatar {
            display: grid;
            place-items: center;
            flex: none;
            width: 40px;
            height: 40px;
            border-radius: 13px;
            background: var(--grad);
            box-shadow: 0 8px 22px -8px rgba(56, 189, 248, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }
        .avatar svg { width: 23px; height: 23px; }
        .avatar.sm { width: 32px; height: 32px; border-radius: 10px; }
        .avatar.sm svg { width: 19px; height: 19px; }
        .avatar.lg {
            width: 80px;
            height: 80px;
            border-radius: 26px;
            box-shadow: 0 18px 60px -12px rgba(56, 189, 248, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }
        .avatar.lg svg { width: 46px; height: 46px; }

        /* ---------- Header ---------- */
        header {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 20px;
            border-bottom: 1px solid var(--line);
            background: rgba(6, 18, 48, 0.6);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
        }

        .brand-wrap { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .brand-text { display: flex; flex-direction: column; min-width: 0; }
        .brand-name {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .model {
            margin-top: 1px;
            font-size: 10.5px;
            line-height: 1.3;
            color: var(--sky-soft);
            opacity: 0.75;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .model:empty { display: none; }

        .icon-btn {
            display: none;
            place-items: center;
            flex: none;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: rgba(37, 99, 235, 0.14);
            color: var(--text);
            cursor: pointer;
        }
        .icon-btn:hover { background: rgba(37, 99, 235, 0.32); }
        .icon-btn svg { width: 20px; height: 20px; }

        .ghost-btn {
            display: none;
            align-items: center;
            gap: 8px;
            flex: none;
            padding: 9px 14px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: rgba(37, 99, 235, 0.14);
            color: var(--text);
            font: 600 13px var(--font);
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .ghost-btn:hover { background: rgba(37, 99, 235, 0.32); border-color: rgba(56, 189, 248, 0.5); }
        .ghost-btn svg { width: 16px; height: 16px; }

        /* ---------- App layout ---------- */
        .app { flex: 1; display: flex; min-height: 0; }

        .sidebar {
            width: 280px;
            flex: none;
            display: flex;
            flex-direction: column;
            min-height: 0;
            border-right: 1px solid var(--line);
            background: rgba(5, 14, 40, 0.5);
        }

        .side-top { padding: 14px 14px 6px; }

        .new-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 11px 14px;
            border: 0;
            border-radius: 14px;
            background: var(--grad);
            color: #fff;
            font: 700 14px var(--font);
            cursor: pointer;
            box-shadow: 0 10px 24px -12px rgba(56, 189, 248, 0.9);
            transition: transform 0.15s;
        }
        .new-btn:hover { transform: translateY(-1px); }
        .new-btn svg { width: 18px; height: 18px; }

        .side-label {
            padding: 14px 20px 6px;
            font-size: 12px;
            font-weight: 700;
            color: var(--muted);
        }

        .chat-list-wrap {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 0 10px 12px;
            scrollbar-width: thin;
            scrollbar-color: rgba(56, 189, 248, 0.3) transparent;
        }

        .chat-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .chat-row {
            display: flex;
            align-items: center;
            border-radius: 12px;
            transition: background 0.15s;
        }
        .chat-row:hover { background: rgba(37, 99, 235, 0.18); }
        .chat-row.active {
            background: linear-gradient(135deg, rgba(30, 64, 255, 0.4), rgba(56, 189, 248, 0.2));
            box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.35);
        }

        .chat-item {
            flex: 1;
            min-width: 0;
            padding: 10px 12px;
            border: 0;
            border-radius: 12px;
            background: transparent;
            color: var(--text);
            text-align: left;
            font: 500 13.5px/1.3 var(--font);
            cursor: pointer;
        }
        .chat-title {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-del {
            display: grid;
            place-items: center;
            flex: none;
            width: 30px;
            height: 30px;
            margin-right: 6px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.15s, background 0.15s, color 0.15s;
        }
        .chat-row:hover .chat-del,
        .chat-row:focus-within .chat-del,
        .chat-row.active .chat-del { opacity: 1; }
        .chat-del:hover { background: rgba(255, 90, 90, 0.18); color: #ffb4b4; }
        .chat-del svg { width: 16px; height: 16px; }
        @media (hover: none) { .chat-del { opacity: 1; } }

        .chat-empty {
            margin: 6px 12px;
            font-size: 12.5px;
            line-height: 1.5;
            color: #6f8ab8;
        }

        .side-foot {
            padding: 10px 20px 14px;
            border-top: 1px solid var(--line);
            font-size: 11.5px;
            color: #6f8ab8;
        }

        .scrim {
            position: fixed;
            inset: 0;
            z-index: 25;
            background: rgba(2, 8, 24, 0.62);
        }

        .workspace {
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        /* ---------- Chat area ---------- */
        #chat {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 28px 16px 12px;
            scrollbar-width: thin;
            scrollbar-color: rgba(56, 189, 248, 0.35) transparent;
        }
        #chat::-webkit-scrollbar { width: 8px; }
        #chat::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.3); border-radius: 8px; }

        #welcome {
            max-width: 720px;
            margin: 0 auto;
            padding-top: 6vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: rise 0.7s ease both;
        }
        #welcome h1 {
            margin: 26px 0 8px;
            font-size: clamp(26px, 5vw, 36px);
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        #welcome p { margin: 0; color: var(--muted); font-size: 15px; }

        .chips {
            width: 100%;
            margin-top: 36px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .chip {
            text-align: left;
            padding: 15px 16px;
            border-radius: 16px;
            border: 1px solid var(--line);
            background: rgba(20, 45, 105, 0.35);
            color: var(--text);
            font: inherit;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s, transform 0.15s;
        }
        .chip:hover {
            background: rgba(37, 99, 235, 0.28);
            border-color: rgba(56, 189, 248, 0.55);
            transform: translateY(-1px);
        }
        .chip b { display: block; font-size: 14px; font-weight: 700; margin-bottom: 3px; }
        .chip span { font-size: 12.5px; color: var(--muted); }

        #thread { max-width: 780px; margin: 0 auto; }

        .msg { display: flex; gap: 14px; margin-bottom: 26px; animation: rise 0.25s ease both; }
        .msg.user { justify-content: flex-end; }

        .bubble {
            max-width: 82%;
            padding: 12px 17px;
            border-radius: 20px 20px 6px 20px;
            background: var(--grad);
            color: #fff;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            box-shadow: 0 10px 28px -12px rgba(37, 99, 235, 0.9);
        }

        .msg.assistant .body { flex: 1; min-width: 0; }
        .who { display: flex; flex-direction: column; margin-bottom: 6px; }
        .who-name { font-size: 13px; font-weight: 800; }
        .who .model { margin-top: 0; }

        .content {
            font-size: 15.5px;
            line-height: 1.7;
            overflow-wrap: anywhere;
        }
        .content > :first-child { margin-top: 0; }
        .content > :last-child { margin-bottom: 0; }
        .content p { margin: 0 0 12px; }
        .content h3, .content h4, .content h5, .content h6 { margin: 20px 0 8px; line-height: 1.3; }
        .content h3 { font-size: 19px; }
        .content h4 { font-size: 17px; }
        .content h5, .content h6 { font-size: 15.5px; }
        .content ul, .content ol { margin: 0 0 12px; padding-left: 24px; }
        .content li { margin: 4px 0; }
        .content li::marker { color: var(--sky); }
        .content a { color: var(--sky-soft); text-underline-offset: 3px; }
        .content hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
        .content code {
            font-family: var(--mono);
            font-size: 0.88em;
            padding: 2px 6px;
            border-radius: 6px;
            background: rgba(56, 189, 248, 0.14);
            color: var(--sky-soft);
        }

        .code {
            margin: 4px 0 14px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #04102e;
            overflow: hidden;
        }
        .code-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 8px 7px 14px;
            background: rgba(37, 99, 235, 0.16);
            border-bottom: 1px solid var(--line);
            font-size: 12px;
            color: var(--muted);
        }
        .code pre { margin: 0; padding: 14px; overflow-x: auto; }
        .code pre code {
            padding: 0;
            background: none;
            color: #d6e9ff;
            font-size: 13px;
            line-height: 1.6;
        }

        .mini-btn {
            padding: 4px 10px;
            border-radius: 8px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--muted);
            font: 600 12px var(--font);
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .mini-btn:hover { background: rgba(56, 189, 248, 0.16); color: var(--text); }

        .actions { margin-top: 6px; margin-left: -10px; min-height: 28px; }

        .note {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px 14px;
            margin-top: 10px;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 140, 140, 0.35);
            background: rgba(255, 90, 90, 0.08);
            color: #ffb4b4;
            font-size: 13.5px;
            line-height: 1.5;
        }
        .content > .note:first-child { margin-top: 0; }
        .note .mini-btn { border-color: rgba(255, 140, 140, 0.4); color: #ffd0d0; padding: 6px 12px; }
        .note .mini-btn:hover { background: rgba(255, 140, 140, 0.16); color: #fff; }

        .typing { display: inline-flex; gap: 5px; padding: 10px 0; }
        .typing i {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--grad);
            animation: bounce 1.1s infinite ease-in-out;
        }
        .typing i:nth-child(2) { animation-delay: 0.15s; }
        .typing i:nth-child(3) { animation-delay: 0.3s; }

        /* ---------- Composer ---------- */
        #input-area { padding: 8px 16px 16px; }
        #form {
            max-width: 780px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 10px 10px 10px 18px;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: var(--panel);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            box-shadow: 0 20px 50px -24px rgba(37, 99, 235, 0.8);
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        #form:focus-within {
            border-color: rgba(56, 189, 248, 0.65);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.12), 0 20px 50px -24px rgba(37, 99, 235, 0.8);
        }

        #message {
            flex: 1;
            resize: none;
            max-height: 180px;
            padding: 10px 0;
            border: 0;
            outline: none;
            background: transparent;
            color: var(--text);
            font: 400 15.5px/1.5 var(--font);
        }
        #message::placeholder { color: #6f8ab8; }

        .send {
            display: grid;
            place-items: center;
            flex: none;
            width: 42px;
            height: 42px;
            border: 0;
            border-radius: 14px;
            background: var(--grad);
            color: #fff;
            cursor: pointer;
            box-shadow: 0 10px 24px -10px rgba(56, 189, 248, 0.9);
            transition: transform 0.15s, opacity 0.15s;
        }
        .send:hover:not(:disabled) { transform: translateY(-1px); }
        .send:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
        .send svg { width: 20px; height: 20px; }
        .send .i-stop { display: none; }
        .send.is-stop { background: linear-gradient(135deg, #1e3a8a, #1d4ed8); }
        .send.is-stop .i-stop { display: block; }
        .send.is-stop .i-send { display: none; }

        .hint {
            max-width: 780px;
            margin: 8px auto 0;
            text-align: center;
            font-size: 11.5px;
            color: #6f8ab8;
        }

        /* ---------- Motion ---------- */
        @keyframes rise {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: none; }
        }
        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
            40% { transform: translateY(-5px); opacity: 1; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }

        /* ---------- Small screens: sidebar becomes a drawer ---------- */
        @media (max-width: 820px) {
            header { padding: 10px 14px; }
            .icon-btn { display: grid; }
            .ghost-btn { display: inline-flex; }
            .ghost-btn span { display: none; }
            .ghost-btn { padding: 9px 10px; }

            .sidebar {
                position: fixed;
                z-index: 30;
                top: 0;
                bottom: 0;
                left: 0;
                width: min(86vw, 310px);
                background: #061638;
                box-shadow: 20px 0 60px -20px rgba(0, 0, 0, 0.6);
                transform: translateX(-102%);
                visibility: hidden;
                transition: transform 0.22s ease, visibility 0s linear 0.22s;
            }
            .sidebar.open {
                transform: none;
                visibility: visible;
                transition: transform 0.22s ease, visibility 0s;
            }

            .chips { grid-template-columns: 1fr; }
            .bubble { max-width: 90%; }
            .msg { gap: 10px; }
            #welcome { padding-top: 3vh; }
        }
    </style>
</head>

<body>

<!-- Shared icons -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
        <linearGradient id="g-spark" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1e40ff"/>
            <stop offset="1" stop-color="#38bdf8"/>
        </linearGradient>
        <symbol id="icon-bot" viewBox="0 0 32 32">
            <path d="M16 4C9.4 4 4 8.9 4 15c0 3.2 1.5 6 3.9 8L7 28l5.2-2.6c1.2.4 2.5.6 3.8.6 6.6 0 12-4.9 12-11S22.6 4 16 4z" fill="#ffffff"/>
            <path d="M16 9l1.7 4.3L22 15l-4.3 1.7L16 21l-1.7-4.3L10 15l4.3-1.7z" fill="url(#g-spark)"/>
        </symbol>
    </defs>
</svg>

<header>
    <div class="brand-wrap">
        <button class="icon-btn" id="menu-btn" type="button" aria-label="Open chat list" aria-controls="sidebar" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>

        <div class="brand">
            <div class="avatar" aria-hidden="true"><svg><use href="#icon-bot"/></svg></div>
            <div class="brand-text">
                <div class="brand-name">CRChatbot Version 1.0.4</div>
                <div class="model" id="model-label">loading model…</div>
            </div>
        </div>
    </div>

    <button class="ghost-btn" id="new-chat-top" type="button" aria-label="Start a new chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>New chat</span>
    </button>
</header>

<div class="app">

    <aside class="sidebar" id="sidebar" aria-label="Chat history">
        <div class="side-top">
            <button class="new-btn" id="new-chat" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                New chat
            </button>
        </div>

        <div class="side-label">Recent chats</div>

        <nav class="chat-list-wrap" aria-label="Previous chats">
            <ul class="chat-list" id="chat-list"></ul>
            <p class="chat-empty" id="chat-empty">No chats yet. Your conversations will show up here.</p>
        </nav>

        <div class="side-foot">Chats are saved in this browser.</div>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <div class="workspace">

        <main id="chat" role="log" aria-live="polite" aria-label="Conversation">

            <section id="welcome">
                <div class="avatar lg" aria-hidden="true"><svg><use href="#icon-bot"/></svg></div>
                <h1>How can I help today?</h1>
                <p>Ask a question, paste some code, or pick a starting point.</p>

                <div class="chips">
                    <button class="chip" type="button" data-prompt="Explain how a transformer neural network works, step by step.">
                        <b>Explain a concept</b><span>Break a topic down step by step</span>
                    </button>
                    <button class="chip" type="button" data-prompt="Help me debug my code. I'll paste the error message next.">
                        <b>Debug my code</b><span>Paste an error and get a fix</span>
                    </button>
                    <button class="chip" type="button" data-prompt="Draft a polite email asking my professor for a deadline extension.">
                        <b>Write an email</b><span>Draft something clear and polite</span>
                    </button>
                    <button class="chip" type="button" data-prompt="Help me plan a study schedule for this week.">
                        <b>Plan my week</b><span>Turn goals into a study schedule</span>
                    </button>
                </div>
            </section>

            <div id="thread"></div>
        </main>

        <div id="input-area">
            <form id="form" autocomplete="off">
                <textarea id="message" rows="1" placeholder="Message CRChatbot" aria-label="Message"></textarea>

                <button class="send" id="send" type="submit" aria-label="Send message" disabled>
                    <svg class="i-send" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                    <svg class="i-stop" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
                </button>
            </form>
            <div class="hint">Press Enter to send, Shift+Enter for a new line</div>
        </div>

    </div>
</div>

<script>
const APP_NAME = "CRChatbot Version 1.0.4";
const NETWORK_ERROR = "Couldn't reach the server. Check that main.py is running, then try again.";
const STORE_CHATS = "crchatbot.chats.v1";
const STORE_ACTIVE = "crchatbot.active.v1";
const MAX_CHATS = 100;
const TRASH_ICON =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';

const form = document.getElementById("form");
const input = document.getElementById("message");
const chatArea = document.getElementById("chat");
const thread = document.getElementById("thread");
const sendButton = document.getElementById("send");
const welcome = document.getElementById("welcome");
const sidebar = document.getElementById("sidebar");
const scrim = document.getElementById("scrim");
const menuButton = document.getElementById("menu-btn");
const chatList = document.getElementById("chat-list");
const chatEmpty = document.getElementById("chat-empty");
const modelLabel = document.getElementById("model-label");

class ApiError extends Error {}

let busy = false;
let controller = null;
let modelName = null;

/* ==========================================================
   Model label
   ========================================================== */

function setModel(name) {
    modelName = name || null;
    if (modelName) {
        modelLabel.textContent = modelName;
        modelLabel.title = "Model: " + modelName;
    } else {
        modelLabel.textContent = "model unavailable";
        modelLabel.title = "Couldn't read /model. Make sure the updated main.py is running (restart the server), then refresh this page.";
    }
}

async function loadModel() {
    for (let attempt = 0; attempt < 3; attempt++) {
        try {
            const res = await fetch("/model", { headers: { Accept: "application/json" }, cache: "no-store" });
            if (!res.ok) throw new Error("GET /model returned " + res.status);

            const type = res.headers.get("content-type") || "";
            let data = type.includes("json") ? await res.json() : await res.text();
            if (data && typeof data === "object") data = data.model || data.name;

            const name = String(data || "").trim().replace(/^"|"$/g, "");
            if (!name) throw new Error("GET /model returned no model name");

            setModel(name);
            return;
        } catch (error) {
            console.warn("Could not load the model name:", error);
            await new Promise((resolve) => setTimeout(resolve, 1200));
        }
    }
    if (!modelName) setModel(null);
}

/* ==========================================================
   Markdown (small, HTML-safe renderer)
   ========================================================== */

function escapeHtml(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

function inlineMarkdown(text) {
    let s = escapeHtml(text);
    const codes = [];

    s = s.replace(/`([^`]+)`/g, (match, code) => {
        codes.push(code);
        return "\u0001" + (codes.length - 1) + "\u0001";
    });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>");
    s = s.replace(
        /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
    );
    s = s.replace(/\u0001(\d+)\u0001/g, (match, i) => "<code>" + codes[i] + "</code>");
    return s;
}

function codeBlockHtml(block) {
    return (
        '<div class="code">' +
        '<div class="code-bar"><span>' + escapeHtml(block.lang || "code") + "</span>" +
        '<button type="button" class="mini-btn copy-code">Copy</button></div>' +
        "<pre><code>" + escapeHtml(block.code) + "</code></pre></div>"
    );
}

function renderMarkdown(source) {
    const blocks = [];

    // Fenced code blocks (an unfinished fence still renders while streaming)
    const text = source.replace(/```([\w+#.-]*)[ \t]*\n([\s\S]*?)(?:```|$)/g, (match, lang, code) => {
        blocks.push({ lang: lang, code: code.replace(/\n$/, "") });
        return "\n\u0000" + (blocks.length - 1) + "\u0000\n";
    });

    let html = "";
    let listType = null;
    let paragraph = [];

    const flushParagraph = () => {
        if (paragraph.length) {
            html += "<p>" + inlineMarkdown(paragraph.join("\n")).replace(/\n/g, "<br>") + "</p>";
            paragraph = [];
        }
    };
    const closeList = () => {
        if (listType) {
            html += "</" + listType + ">";
            listType = null;
        }
    };

    for (const raw of text.split("\n")) {
        const line = raw.trimEnd();
        let m;

        if (!line.trim()) {
            flushParagraph();
            closeList();
            continue;
        }

        if ((m = line.match(/^\u0000(\d+)\u0000$/))) {
            flushParagraph();
            closeList();
            html += codeBlockHtml(blocks[Number(m[1])]);
            continue;
        }

        if ((m = line.match(/^(#{1,4})\s+(.*)$/))) {
            flushParagraph();
            closeList();
            const level = m[1].length + 2;
            html += "<h" + level + ">" + inlineMarkdown(m[2]) + "</h" + level + ">";
            continue;
        }

        if (/^(-{3,}|\*{3,})$/.test(line.trim())) {
            flushParagraph();
            closeList();
            html += "<hr>";
            continue;
        }

        if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) {
            flushParagraph();
            if (listType !== "ul") { closeList(); html += "<ul>"; listType = "ul"; }
            html += "<li>" + inlineMarkdown(m[1]) + "</li>";
            continue;
        }

        if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
            flushParagraph();
            if (listType !== "ol") { closeList(); html += "<ol>"; listType = "ol"; }
            html += "<li>" + inlineMarkdown(m[1]) + "</li>";
            continue;
        }

        closeList();
        paragraph.push(line);
    }

    flushParagraph();
    closeList();
    return html;
}

/* ==========================================================
   Chat history (saved in this browser)
   ========================================================== */

function loadChats() {
    try {
        const parsed = JSON.parse(localStorage.getItem(STORE_CHATS) || "[]");
        if (!Array.isArray(parsed)) return [];

        return parsed
            .filter((c) => c && typeof c.id === "string" && Array.isArray(c.messages))
            .map((c) => ({
                id: c.id,
                title: typeof c.title === "string" && c.title ? c.title : "New chat",
                updatedAt: Number(c.updatedAt) || 0,
                messages: c.messages
                    .filter((m) => m && (m.role === "user" || m.role === "assistant") && typeof m.content === "string")
                    .map((m) => ({
                        role: m.role,
                        content: m.content,
                        model: typeof m.model === "string" ? m.model : null,
                        error: m.error === true
                    }))
            }));
    } catch (error) {
        console.warn("Could not read saved chats:", error);
        return [];
    }
}

function loadActiveId() {
    try {
        return localStorage.getItem(STORE_ACTIVE) || null;
    } catch (error) {
        return null;
    }
}

let chats = loadChats();
let activeId = loadActiveId();
if (!chats.some((c) => c.id === activeId)) activeId = null;

function saveChats() {
    try {
        localStorage.setItem(STORE_CHATS, JSON.stringify(chats));
    } catch (error) {
        console.warn("Could not save chats:", error);
    }
}

function saveActive() {
    try {
        localStorage.setItem(STORE_ACTIVE, activeId || "");
    } catch (error) {
        console.warn("Could not save the active chat:", error);
    }
}

function sortedChats() {
    return chats.slice().sort((a, b) => b.updatedAt - a.updatedAt);
}

function getActiveChat() {
    return chats.find((c) => c.id === activeId) || null;
}

function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function makeTitle(text) {
    const clean = text.replace(/\s+/g, " ").trim();
    if (!clean) return "New chat";
    return clean.length > 42 ? clean.slice(0, 42).trimEnd() + "…" : clean;
}

function renderSidebar() {
    chatList.textContent = "";
    const list = sortedChats();
    chatEmpty.hidden = list.length > 0;

    for (const c of list) {
        const row = document.createElement("li");
        row.className = "chat-row" + (c.id === activeId ? " active" : "");

        const open = document.createElement("button");
        open.type = "button";
        open.className = "chat-item";
        open.dataset.id = c.id;
        open.title = c.title;
        if (c.id === activeId) open.setAttribute("aria-current", "true");

        const title = document.createElement("span");
        title.className = "chat-title";
        title.textContent = c.title;
        open.appendChild(title);

        const del = document.createElement("button");
        del.type = "button";
        del.className = "chat-del";
        del.dataset.id = c.id;
        del.setAttribute("aria-label", "Delete chat: " + c.title);
        del.title = "Delete chat";
        del.innerHTML = TRASH_ICON;

        row.appendChild(open);
        row.appendChild(del);
        chatList.appendChild(row);
    }
}

chatList.addEventListener("click", (event) => {
    const del = event.target.closest(".chat-del");
    if (del) {
        deleteChat(del.dataset.id);
        return;
    }
    const item = event.target.closest(".chat-item");
    if (item) openChat(item.dataset.id);
});

/* ==========================================================
   Drawer (mobile sidebar)
   ========================================================== */

function openDrawer() {
    sidebar.classList.add("open");
    scrim.hidden = false;
    menuButton.setAttribute("aria-expanded", "true");
}

function closeDrawer() {
    sidebar.classList.remove("open");
    scrim.hidden = true;
    menuButton.setAttribute("aria-expanded", "false");
}

menuButton.addEventListener("click", openDrawer);
scrim.addEventListener("click", closeDrawer);
document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") closeDrawer();
});
window.matchMedia("(min-width: 821px)").addEventListener("change", (event) => {
    if (event.matches) closeDrawer();
});

/* ==========================================================
   Messages
   ========================================================== */

function isNearBottom() {
    return chatArea.scrollHeight - chatArea.scrollTop - chatArea.clientHeight < 90;
}

function scrollToBottom() {
    chatArea.scrollTop = chatArea.scrollHeight;
}

function focusInput() {
    if (window.matchMedia("(min-width: 821px)").matches) input.focus();
}

function addUserMessage(text) {
    const message = document.createElement("article");
    message.className = "msg user";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    message.appendChild(bubble);
    thread.appendChild(message);
}

function createAssistantView(model) {
    const message = document.createElement("article");
    message.className = "msg assistant";
    message.innerHTML =
        '<div class="avatar sm" aria-hidden="true"><svg><use href="#icon-bot"/></svg></div>' +
        '<div class="body">' +
            '<div class="who"><span class="who-name"></span><span class="model msg-model"></span></div>' +
            '<div class="content"><span class="typing" role="status" aria-label="CRChatbot is typing"><i></i><i></i><i></i></span></div>' +
            '<div class="actions"></div>' +
        "</div>";

    message.querySelector(".who-name").textContent = APP_NAME;
    const label = message.querySelector(".msg-model");
    label.textContent = model || "";

    const content = message.querySelector(".content");
    const actions = message.querySelector(".actions");
    let raw = "";
    let frame = 0;

    const paint = () => {
        frame = 0;
        const stick = isNearBottom();
        content.innerHTML = renderMarkdown(raw);
        if (stick) scrollToBottom();
    };

    const addNote = (text, onRetry) => {
        const note = document.createElement("div");
        note.className = "note";
        note.setAttribute("role", "alert");

        const span = document.createElement("span");
        span.textContent = text;
        note.appendChild(span);

        if (onRetry) {
            const retry = document.createElement("button");
            retry.type = "button";
            retry.className = "mini-btn retry";
            retry.textContent = "Try again";
            retry.addEventListener("click", onRetry);
            note.appendChild(retry);
        }
        content.appendChild(note);
    };

    thread.appendChild(message);

    return {
        setModel(name) {
            label.textContent = name || "";
        },
        update(text) {
            raw = text;
            if (!frame) frame = requestAnimationFrame(paint);
        },
        finish() {
            if (frame) cancelAnimationFrame(frame);
            frame = 0;
            if (raw) {
                paint();
                const copy = document.createElement("button");
                copy.type = "button";
                copy.className = "mini-btn";
                copy.textContent = "Copy";
                copy.addEventListener("click", () => copyText(raw, copy));
                actions.appendChild(copy);
            } else {
                content.innerHTML = "";
            }
        },
        fail(text, onRetry) {
            if (frame) cancelAnimationFrame(frame);
            frame = 0;
            if (raw) {
                paint();
            } else {
                content.innerHTML = "";
            }
            addNote(text, onRetry);
            if (isNearBottom()) scrollToBottom();
        },
        remove() {
            if (frame) cancelAnimationFrame(frame);
            frame = 0;
            message.remove();
        }
    };
}

function renderChat(convo) {
    thread.textContent = "";
    welcome.hidden = convo.messages.length > 0;

    convo.messages.forEach((m, index) => {
        if (m.role === "user") {
            addUserMessage(m.content);
            return;
        }

        const view = createAssistantView(m.model);
        if (m.error) {
            const isLast = index === convo.messages.length - 1;
            view.fail(m.content, isLast ? () => retryLast(convo) : null);
        } else {
            view.update(m.content);
            view.finish();
        }
    });

    scrollToBottom();
}

async function copyText(text, button) {
    const original = button.textContent;
    try {
        await navigator.clipboard.writeText(text);
        button.textContent = "Copied";
    } catch (error) {
        console.error(error);
        button.textContent = "Copy failed";
    }
    setTimeout(() => { button.textContent = original; }, 1500);
}

chatArea.addEventListener("click", (event) => {
    const button = event.target.closest(".copy-code");
    if (!button) return;
    const code = button.closest(".code").querySelector("pre").textContent;
    copyText(code, button);
});

/* ==========================================================
   Chat actions: new, open, delete
   ========================================================== */

function startBlankChat() {
    activeId = null;
    saveActive();
    thread.textContent = "";
    welcome.hidden = false;
    chatArea.scrollTop = 0;
    renderSidebar();
}

function stopStreaming() {
    if (controller) controller.abort();
}

function newChat() {
    closeDrawer();
    stopStreaming();
    startBlankChat();
    focusInput();
}

function openChat(id) {
    closeDrawer();
    if (id === activeId) return;

    const convo = chats.find((c) => c.id === id);
    if (!convo) return;

    stopStreaming();
    activeId = id;
    saveActive();
    renderChat(convo);
    renderSidebar();
    focusInput();
}

function deleteChat(id) {
    const convo = chats.find((c) => c.id === id);
    if (!convo) return;
    if (!window.confirm('Delete "' + convo.title + '"? This can\'t be undone.')) return;

    const wasActive = id === activeId;
    if (wasActive) stopStreaming();

    chats = chats.filter((c) => c.id !== id);
    saveChats();

    if (wasActive) {
        startBlankChat();
    } else {
        renderSidebar();
    }
}

/* ==========================================================
   Sending and streaming
   ========================================================== */

function updateSendState() {
    sendButton.classList.toggle("is-stop", busy);
    sendButton.setAttribute("aria-label", busy ? "Stop generating" : "Send message");
    sendButton.disabled = !busy && !input.value.trim();
}

function autosize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 180) + "px";
}

function buildPayload(convo) {
    return convo.messages
        .filter((m) => !m.error && m.content && m.content.trim())
        .map((m) => ({ role: m.role, content: m.content }))
        .slice(-40);
}

async function readError(response) {
    try {
        const data = await response.json();
        if (data && typeof data.detail === "string") return data.detail;
    } catch (error) {
        // not JSON, fall through
    }
    return "The server returned an error (" + response.status + "). Check the terminal running main.py.";
}

function sendMessage(text) {
    if (busy) return;

    let convo = getActiveChat();
    if (!convo) {
        convo = { id: uid(), title: makeTitle(text), updatedAt: Date.now(), messages: [] };
        chats.unshift(convo);
        if (chats.length > MAX_CHATS) chats = sortedChats().slice(0, MAX_CHATS);
        activeId = convo.id;
        saveActive();
    }

    // A new message replaces any old "Try again" button
    thread.querySelectorAll(".retry").forEach((button) => button.remove());

    welcome.hidden = true;
    convo.messages.push({ role: "user", content: text, model: null, error: false });
    convo.updatedAt = Date.now();
    saveChats();
    renderSidebar();

    addUserMessage(text);
    scrollToBottom();
    streamReply(convo);
}

function retryLast(convo) {
    if (busy || convo.id !== activeId) return;

    const last = convo.messages[convo.messages.length - 1];
    if (!last || !last.error) return;

    convo.messages.pop();
    saveChats();

    const lastElement = thread.lastElementChild;
    if (lastElement && lastElement.classList.contains("assistant")) lastElement.remove();

    streamReply(convo);
}

async function streamReply(convo) {
    const myController = new AbortController();
    controller = myController;
    busy = true;
    updateSendState();

    const view = createAssistantView(modelName);
    scrollToBottom();

    let answer = "";
    let usedModel = modelName;

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ messages: buildPayload(convo) }),
            signal: myController.signal
        });

        if (!response.ok) {
            throw new ApiError(await readError(response));
        }

        if (!response.body) {
            throw new ApiError("Streaming is not supported by this response.");
        }

        // The backend reports which model actually answered
        const headerModel = response.headers.get("X-Model");
        if (headerModel) {
            usedModel = headerModel;
            setModel(headerModel);
            view.setModel(headerModel);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
            const { value, done } = await reader.read();
            if (done) break;

            answer += decoder.decode(value, { stream: true });
            view.update(answer);
        }

        answer += decoder.decode();

        if (!answer.trim()) {
            throw new ApiError("The model returned an empty reply. Try again.");
        }

        convo.messages.push({ role: "assistant", content: answer, model: usedModel, error: false });
        view.update(answer);
        view.finish();

    } catch (error) {

        if (error.name === "AbortError") {
            if (answer.trim()) {
                convo.messages.push({ role: "assistant", content: answer, model: usedModel, error: false });
                view.finish();
            } else {
                view.remove();
            }
        } else {
            console.error(error);
            const text = error instanceof ApiError ? error.message : NETWORK_ERROR;

            if (answer.trim()) {
                convo.messages.push({ role: "assistant", content: answer, model: usedModel, error: false });
                view.fail(text);
            } else {
                convo.messages.push({ role: "assistant", content: text, model: null, error: true });
                view.fail(text, () => retryLast(convo));
            }
        }

    } finally {

        convo.updatedAt = Date.now();
        saveChats();
        renderSidebar();

        if (controller === myController) {
            controller = null;
            busy = false;
            updateSendState();
            focusInput();
        }
    }
}

/* ==========================================================
   Wiring
   ========================================================== */

form.addEventListener("submit", (event) => {
    event.preventDefault();

    if (busy) {
        stopStreaming();
        return;
    }

    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    autosize();
    updateSendState();
    sendMessage(text);
});

input.addEventListener("input", () => {
    autosize();
    updateSendState();
});

input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        if (!busy) form.requestSubmit();
    }
});

document.querySelectorAll(".chip").forEach((chip) => {
    chip.addEventListener("click", () => {
        if (!busy) sendMessage(chip.dataset.prompt);
    });
});

document.getElementById("new-chat").addEventListener("click", newChat);
document.getElementById("new-chat-top").addEventListener("click", newChat);

// Start up
renderSidebar();
const startChat = getActiveChat();
if (startChat) renderChat(startChat);

loadModel();
updateSendState();
focusInput();
</script>

</body>
</html>
